  <path d="M16 12 V2088" stroke="#30363D" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M16 12 V2088" stroke="#FF7B72" stroke-width="2" fill="none" stroke-dasharray="8 14" opacity=".45">
    <animate attributeName="stroke-dashoffset" values="22;0" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <g>
    <animateMotion dur="20s" repeatCount="indefinite" path="M 36 2060 V 40"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -3 0; 0 0" dur=".5s" repeatCount="indefinite"/>
      <use href="#cube" transform="scale(0.84)"/>
    </g>
  </g>
  <g>
    <animateMotion dur="24s" begin="2s" repeatCount="indefinite" path="M 36 40 V 2060"/>
    <use href="#chef" transform="scale(0.86)"/>
  </g>
  <g>
    <animateMotion dur="19s" begin="5s" repeatCount="indefinite" path="M 36 1900 V 120 V 1900"/>
    <use href="#reader" transform="scale(0.84)"/>
