<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 2150" width="80" height="2150" role="img" aria-label="Claude AI mascots climbing and hovering along the right frame rail">
  <defs>
    <!-- 1. CODER CUBE (Climbing Downwards with Backpack) -->
    <g id="cube-buddy">
      <!-- Backpack -->
      <rect x="-16" y="-8" width="8" height="15" rx="3" fill="#854D0E" stroke="#583101" stroke-width="1.2"/>
      <!-- 3D Cube -->
      <polygon points="-14,-10 6,-14 16,-7 -4,-3" fill="#F97316"/>
      <polygon points="-4,-3 16,-7 16,10 -4,14" fill="#B45309" stroke="#78350F" stroke-width="1"/>
      <rect x="-16" y="-5" width="20" height="20" rx="3" fill="#EA580C" stroke="#78350F" stroke-width="1.4"/>
      <!-- Kawaii Eyes -->
      <ellipse cx="-11" cy="2" rx="2.5" ry="3.5" fill="#18181B"/>
      <ellipse cx="-2" cy="2" rx="2.5" ry="3.5" fill="#18181B"/>
      <circle cx="-12" cy="1" r="1.1" fill="#FFFFFF"/>
      <circle cx="-3" cy="1" r="1.1" fill="#FFFFFF"/>
      <!-- Smile -->
      <path d="M-8 7 Q-6 10 -4 7" stroke="#18181B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- Blushing -->
      <ellipse cx="-13" cy="5" rx="1.6" ry="1" fill="#FECDD3"/>
      <ellipse cx="0" cy="5" rx="1.6" ry="1" fill="#FECDD3"/>
      <!-- Grip arms holding the ladder rail -->
      <rect x="7" y="-2" width="6" height="4" rx="1.5" fill="#C2410C" stroke="#78350F" stroke-width="0.8"/>
      <!-- Little legs climbing -->
      <rect x="-13" y="14" width="4" height="6" rx="1.5" fill="#C2410C"/>
      <rect x="-5" y="14" width="4" height="6" rx="1.5" fill="#C2410C"/>
      <!-- Mini code document clipped on side -->
      <g transform="translate(-22, -3)">
        <rect width="10" height="13" rx="1.2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.9"/>
        <text x="5" y="8.5" font-family="monospace" font-size="5.5" font-weight="bold" fill="#10B981" text-anchor="middle">&lt;/&gt;</text>
      </g>
    </g>

    <!-- 2. CHEF CLAUDE (Floating with Hot Treat) -->
    <g id="chef-bean">
      <!-- Toque -->
      <g transform="translate(0, -15)">
        <path d="M-11 -12 C-14 -20 -1 -24 0 -17 C3 -24 14 -20 11 -12 C14 -9 12 -3 9 -3 L-8 -3 C-12 -3 -14 -9 -11 -12 Z" fill="#FFFFFF" stroke="#261710" stroke-width="1.6"/>
        <rect x="-9" y="-3" width="18" height="5" rx="1.5" fill="#F1F5F9" stroke="#261710" stroke-width="1.4"/>
      </g>
      <ellipse cx="0" cy="0" rx="18" ry="16" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="-9" cy="4" rx="3.8" ry="2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="9" cy="4" rx="3.8" ry="2" fill="#FF8D7A" opacity="0.85"/>
      <!-- Winking face -->
      <rect x="-10" y="-6" width="5.5" height="9" rx="1.5" fill="#1C130E"/>
      <circle cx="-7.5" cy="-3.5" r="1.3" fill="#FFFFFF"/>
      <path d="M3 -2 L10 -5 L10 -1 Z" fill="#1C130E"/>
      <!-- Frying Pan with golden pancake -->
      <g transform="translate(14, 1)">
        <ellipse cx="9" cy="-1" rx="8" ry="3.2" fill="#334155" stroke="#1E293B" stroke-width="1.2"/>
        <line x1="2" y1="0" x2="-3" y2="1" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round"/>
        <ellipse cx="9" cy="-3" rx="5" ry="2.2" fill="#F59E0B"/>
      </g>
      <!-- Feet -->
      <ellipse cx="-9" cy="16" rx="2.8" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="1.5"/>
      <ellipse cx="9" cy="16" rx="2.8" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="1.5"/>
    </g>

    <!-- 3. LO-FI PIXEL ROCKER ON HOVER LIFT -->
    <g id="pixel-guitarist-lift">
      <!-- Hover Platform underneath -->
      <g transform="translate(0, 18)">
        <rect x="-18" y="0" width="36" height="6" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <line x1="-14" y1="2" x2="14" y2="2" stroke="#A855F7" stroke-width="1.5"/>
        <!-- Thruster Glow -->
        <polygon points="-10,6 0,14 10,6" fill="#A855F7" opacity="0.7">
          <animate attributeName="opacity" values="0.4;0.9;0.4" dur="0.3s" repeatCount="indefinite"/>
        </polygon>
      </g>
      <!-- Pixel Mascot -->
      <rect x="-12" y="-12" width="24" height="20" fill="#E06A3B"/>
      <rect x="-16" y="-4" width="5" height="8" fill="#E06A3B"/>
      <rect x="11" y="-4" width="5" height="8" fill="#E06A3B"/>
      <!-- Eyes -->
      <rect x="-8" y="-7" width="4.5" height="6" fill="#18181B"/>
      <rect x="3" y="-7" width="4.5" height="6" fill="#18181B"/>
      <rect x="-7" y="-6" width="1.8" height="1.8" fill="#FFFFFF"/>
      <rect x="4" y="-6" width="1.8" height="1.8" fill="#FFFFFF"/>
      <!-- Electric Purple Guitar -->
      <g transform="translate(-2, 1) rotate(-24)">
        <path d="M-8 5 C-12 1 -15 8 -11 13 C-8 18 -2 17 2 14 C6 10 3 4 -1 4 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="1.2"/>
        <rect x="1" y="-14" width="2.5" height="18" fill="#D4D4D8" stroke="#3F3F46" stroke-width="0.7"/>
        <path d="M1 -14 L4 -16 L4 -12 Z" fill="#7C3AED"/>
      </g>
      <!-- Floating Pixel Notes -->
      <text x="14" y="-12" font-family="monospace" font-size="10" font-weight="bold" fill="#C084FC">♪</text>
    </g>
  </defs>

  <!-- ================= VERTICAL RUNWAY / RAIL ================= -->
  <line x1="40" y1="15" x2="40" y2="2135" stroke="#21262D" stroke-width="3" stroke-linecap="round"/>
  <!-- Energy Pulses travelling DOWNWARDS -->
  <line x1="40" y1="15" x2="40" y2="2135" stroke="#FF7B72" stroke-width="2" stroke-dasharray="10 20" stroke-linecap="round" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="30; 0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Waypoint Nodes on Right Rail -->
  <!-- Node 1 (Top) -->
  <g transform="translate(40, 60)">
    <circle r="5" fill="#161B22" stroke="#FF7B72" stroke-width="1.8"/>
    <circle r="2" fill="#FF7B72"/>
  </g>

  <!-- Node 2 (About Me - Peek Marker) -->
  <g transform="translate(40, 480)">
    <circle r="5" fill="#161B22" stroke="#F43F5E" stroke-width="1.8"/>
    <circle r="2" fill="#F43F5E"/>
    <!-- Mini Speech Badge -->
    <rect x="9" y="-8" width="24" height="14" rx="4" fill="#0D1117" stroke="#F43F5E" stroke-width="0.9"/>
    <text x="21" y="2" font-family="sans-serif" font-size="7" font-weight="bold" fill="#F43F5E" text-anchor="middle">HI! 👋</text>
  </g>

  <!-- Node 3 (Tech Stack - Gear) -->
  <g transform="translate(40, 1020)">
    <circle r="5" fill="#161B22" stroke="#38BDF8" stroke-width="1.8"/>
    <circle r="2" fill="#38BDF8"/>
    <circle cx="16" cy="0" r="5" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 2">
      <animateTransform attributeName="transform" type="rotate" values="0 16 0; 360 16 0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Node 4 (GitHub Streak - Flame) -->
  <g transform="translate(40, 1580)">
    <circle r="5" fill="#161B22" stroke="#F97316" stroke-width="1.8"/>
    <circle r="2" fill="#F97316"/>
    <!-- Fire Flame -->
    <path d="M16 4 C13 4 12 1 14 -2 C12 -1 12 -4 15 -6 C18 -4 19 -1 17 4 Z" fill="#F97316">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Node 5 (Bottom) -->
  <g transform="translate(40, 2080)">
    <circle r="5" fill="#161B22" stroke="#FF7B72" stroke-width="1.8"/>
    <circle r="2" fill="#FF7B72"/>
  </g>

  <!-- ================= ANIMATED CAST CHOREOGRAPHY ================= -->

  <!-- 1. Coder Cube climbing DOWNWARDS (y: 50 -> 2060) -->
  <g>
    <animateMotion dur="23s" repeatCount="indefinite" path="M 40 50 V 2060"/>
    <g>
      <!-- Stepping down ladder -->
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 2; 2 4; 0 0" dur="0.55s" repeatCount="indefinite"/>
      <use href="#cube-buddy" transform="scale(0.8)"/>
    </g>
  </g>

  <!-- 2. Lofi Rocker ascending UPWARDS on Hover Lift (y: 2060 -> 60) -->
  <g>
    <animateMotion dur="26s" begin="2s" repeatCount="indefinite" path="M 40 2060 V 60"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.45s" repeatCount="indefinite"/>
      <use href="#pixel-guitarist-lift" transform="scale(0.8)"/>
    </g>
  </g>

  <!-- 3. Chef Claude sliding DOWNWARDS (y: 80 -> 1980) -->
  <g>
    <animateMotion dur="28s" begin="7s" repeatCount="indefinite" path="M 40 80 V 1980"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 0 0; 3 0 0; -3 0 0" dur="1.2s" repeatCount="indefinite"/>
      <use href="#chef-bean" transform="scale(0.76)"/>
    </g>
  </g>
</svg>
