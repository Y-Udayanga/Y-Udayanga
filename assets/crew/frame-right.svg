<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 2100" width="64" height="2100" role="img" aria-label="Friends climbing the right edge">
  <defs>
    <g id="chef">
      <rect x="-11" y="-28" width="22" height="8" rx="3" fill="#EEF2F6" stroke="#2A1A12" stroke-width="1.6"/>
      <rect x="-7" y="-21" width="14" height="10" rx="2" fill="#EEF2F6" stroke="#2A1A12" stroke-width="1.6"/>
      <ellipse cx="-23" cy="4" rx="8" ry="5.2" fill="#C45C38" stroke="#2A1A12" stroke-width="1.8"/>
      <ellipse cx="0" cy="2" rx="20" ry="17.5" fill="#C45C38" stroke="#2A1A12" stroke-width="2"/>
      <rect x="-12" y="-7" width="7" height="10" rx="1.3" fill="#1A120E"/>
      <path d="M4 -6 h8 v3 h-3 v4 h-5 z" fill="#1A120E"/>
      <g transform="translate(26,2) rotate(-12)">
        <rect x="-7" y="-6" width="16" height="12" rx="2" fill="#2B2F36" stroke="#111" stroke-width="1.4"/>
        <rect x="9" y="-3" width="5" height="6" rx="1" fill="#1A1D22"/>
      </g>
      <ellipse cx="-7" cy="20" rx="3.2" ry="6.2" fill="#C45C38" stroke="#2A1A12" stroke-width="1.7"/>
      <ellipse cx="6" cy="20" rx="3.2" ry="6.2" fill="#C45C38" stroke="#2A1A12" stroke-width="1.7"/>
    </g>
    <g id="cube">
      <ellipse cx="14" cy="8" rx="6" ry="8" fill="#D4A373" stroke="#8A5A2B" stroke-width="1.3"/>
      <rect x="-16" y="-14" width="30" height="30" rx="6" fill="#E07A5F" stroke="#9B4A38" stroke-width="1.8"/>
      <circle cx="-6" cy="-4" r="2.3" fill="#3B2417"/>
      <circle cx="6" cy="-4" r="2.3" fill="#3B2417"/>
      <path d="M-5 4 q5 5 10 0" stroke="#3B2417" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <g transform="translate(-22,-18)">
        <rect width="14" height="16" rx="1.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
        <text x="7" y="11" font-family="ui-monospace,monospace" font-size="8" fill="#2563EB" text-anchor="middle">&lt;/&gt;</text>
      </g>
    </g>
    <g id="reader">
      <ellipse cx="-22" cy="4" rx="7.5" ry="5" fill="#C45C38" stroke="#2A1A12" stroke-width="1.7"/>
      <ellipse cx="22" cy="4" rx="7.5" ry="5" fill="#C45C38" stroke="#2A1A12" stroke-width="1.7"/>
      <ellipse cx="0" cy="2" rx="20" ry="17.5" fill="#C45C38" stroke="#2A1A12" stroke-width="2"/>
      <rect x="-10" y="-8" width="6.5" height="8" rx="1.2" fill="#1A120E"/>
      <rect x="3.5" y="-8" width="6.5" height="8" rx="1.2" fill="#1A120E"/>
      <g transform="translate(0,8)">
        <rect x="-11" y="-2" width="10" height="12" rx="1" fill="#3F9B4A" stroke="#1F5C28" stroke-width="1.2"/>
        <rect x="1" y="-2" width="10" height="12" rx="1" fill="#4CAF50" stroke="#1F5C28" stroke-width="1.2"/>
      </g>
      <ellipse cx="-7" cy="21" rx="3.2" ry="6" fill="#C45C38" stroke="#2A1A12" stroke-width="1.6"/>
      <ellipse cx="7" cy="21" rx="3.2" ry="6" fill="#C45C38" stroke="#2A1A12" stroke-width="1.6"/>
    </g>
