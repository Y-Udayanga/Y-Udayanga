    <g id="otter">
      <ellipse cx="0" cy="10" rx="16" ry="15" fill="#C17A4A" stroke="#5C3A24" stroke-width="1.6"/>
      <ellipse cx="0" cy="14" rx="10" ry="8" fill="#F3D6B4"/>
      <circle cx="0" cy="-6" r="13.5" fill="#C17A4A" stroke="#5C3A24" stroke-width="1.6"/>
