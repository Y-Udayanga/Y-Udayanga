<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 2150" width="80" height="2150" role="img" aria-label="Claude AI mascots climbing and gliding along the left frame rail">
  <defs>
    <!-- 1. SPARKLE CLAUDE BEAN (Climbing / Acrobatics) -->
    <g id="sparkle-bean">
      <!-- Outstretched arms holding / waving -->
      <ellipse cx="-20" cy="0" rx="8" ry="5" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="20" cy="0" rx="8" ry="5" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="19" ry="17" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="0" cy="3" rx="13" ry="9" fill="#E88266" opacity="0.35"/>
      <ellipse cx="-10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-10" y="-8" width="6" height="10" rx="1.8" fill="#1C130E"/>
      <rect x="4" y="-8" width="6" height="10" rx="1.8" fill="#1C130E"/>
      <circle cx="-8" cy="-5" r="1.4" fill="#FFFFFF"/>
      <circle cx="6" cy="-5" r="1.4" fill="#FFFFFF"/>
      <path d="M-3 5 Q0 8 3 5" stroke="#1C130E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- Dangling feet -->
      <ellipse cx="-10" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3" cy="19" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="4" cy="19" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <!-- Mini sparkle -->
      <path d="M-22 -10 Q-22 -6 -26 -6 Q-22 -6 -22 -2 Q-22 -6 -18 -6 Q-22 -6 -22 -10" fill="#FBBF24"/>
    </g>

    <!-- 2. SCHOLAR / READER CLAUDE (Gliding with Open Book) -->
    <g id="reader-bean">
      <ellipse cx="0" cy="0" rx="19" ry="16" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="-10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-10" y="-7" width="6" height="8" rx="1.8" fill="#1C130E"/>
      <rect x="4" y="-7" width="6" height="8" rx="1.8" fill="#1C130E"/>
      <circle cx="-7" cy="-4" r="1.3" fill="#FFFFFF"/>
      <circle cx="6" cy="-4" r="1.3" fill="#FFFFFF"/>
      <!-- Open Green Book -->
      <g transform="translate(0, 6)">
        <path d="M-13 -3 L0 -1 L13 -3 L13 9 L0 11 L-13 9 Z" fill="#059669" stroke="#064E3B" stroke-width="1.2"/>
        <path d="M-12 -3 L-1 -1 L-1 10 L-12 8 Z" fill="#FFFFFF"/>
        <path d="M12 -3 L1 -1 L1 10 L12 8 Z" fill="#FFFFFF"/>
      </g>
      <ellipse cx="-9" cy="17" rx="3" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="9" cy="17" rx="3" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <!-- Glowing Lightbulb -->
      <circle cx="0" cy="-19" r="4" fill="#FBBF24" stroke="#D97706" stroke-width="0.9"/>
      <rect x="-1.5" y="-15" width="3" height="1.8" fill="#78716C"/>
    </g>

    <!-- 3. DJ CLAUDE (Gliding Down with Headphones) -->
    <g id="dj-bean">
      <path d="M-17 -5 C-19 -19 19 -19 17 -5" stroke="#475569" stroke-width="3.8" fill="none" stroke-linecap="round"/>
      <rect x="-22" y="-9" width="7" height="13" rx="3" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.4"/>
      <rect x="15" y="-9" width="7" height="13" rx="3" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.4"/>
      <ellipse cx="0" cy="2" rx="18" ry="16" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="-9" cy="5" rx="3.8" ry="2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="9" cy="5" rx="3.8" ry="2" fill="#FF8D7A" opacity="0.85"/>
      <path d="M-11 -2 Q-8 -6 -5 -2" stroke="#1C130E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M5 -2 Q8 -6 11 -2" stroke="#1C130E" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="-9" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="9" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <!-- Trailing musical notes -->
      <text x="-16" y="-15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">♪</text>
      <text x="12" y="-14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#A855F7">♫</text>
    </g>
  </defs>

  <!-- ================= VERTICAL RUNWAY / RAIL ================= -->
  <!-- Central Guide Wire -->
  <line x1="40" y1="15" x2="40" y2="2135" stroke="#21262D" stroke-width="3" stroke-linecap="round"/>
  <!-- Energy Pulses travelling UPWARDS -->
  <line x1="40" y1="15" x2="40" y2="2135" stroke="#58A6FF" stroke-width="2" stroke-dasharray="10 20" stroke-linecap="round" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0; 30" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Milestones / Waypoint Nodes -->
  <!-- Node 1 (Profile Top) -->
  <g transform="translate(40, 60)">
    <circle r="5" fill="#161B22" stroke="#58A6FF" stroke-width="1.8"/>
    <circle r="2" fill="#58A6FF"/>
  </g>

  <!-- Node 2 (Snapshot / About Me) -->
  <g transform="translate(40, 380)">
    <circle r="5" fill="#161B22" stroke="#38BDF8" stroke-width="1.8"/>
    <circle r="2" fill="#38BDF8"/>
    <rect x="-14" y="-8" width="8" height="8" rx="2" fill="#0D1117" stroke="#30363D"/>
    <text x="-10" y="-2" font-family="monospace" font-size="6" fill="#38BDF8" text-anchor="middle">&lt;&gt;</text>
  </g>

  <!-- Node 3 (Tech Stack) - Steaming Coffee Cup -->
  <g transform="translate(40, 920)">
    <circle r="5" fill="#161B22" stroke="#F59E0B" stroke-width="1.8"/>
    <circle r="2" fill="#F59E0B"/>
    <!-- Coffee mug resting on mini ledge -->
    <g transform="translate(-16, -7)">
      <rect x="0" y="0" width="9" height="9" rx="1.5" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
      <path d="M9 2 C11 2 11 6 9 6" stroke="#B45309" stroke-width="0.8" fill="none"/>
      <path d="M3 -3 Q4 -6 3 -8" stroke="#94A3B8" stroke-width="0.8" fill="none" opacity="0.7">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Node 4 (GitHub Stats) - Golden Star -->
  <g transform="translate(40, 1480)">
    <circle r="5" fill="#161B22" stroke="#EAB308" stroke-width="1.8"/>
    <circle r="2" fill="#EAB308"/>
    <!-- Golden Star -->
    <path d="M-14 -1 M-14 -6 L-12 -2 L-8 -2 L-11 1 L-10 5 L-14 3 L-18 5 L-17 1 L-20 -2 L-16 -2 Z" fill="#FACC15">
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Node 5 (Trophies / Footer) -->
  <g transform="translate(40, 2080)">
    <circle r="5" fill="#161B22" stroke="#58A6FF" stroke-width="1.8"/>
    <circle r="2" fill="#58A6FF"/>
  </g>

  <!-- ================= ANIMATED CAST CHOREOGRAPHY ================= -->

  <!-- 1. Sparkle Bean climbing UPWARDS (y: 2060 -> 50) -->
  <g>
    <animateMotion dur="24s" repeatCount="indefinite" path="M 40 2060 V 50"/>
    <g>
      <!-- Swaying side to side like climbing hand-over-hand -->
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -2; -3 -4; 0 0" dur="0.6s" repeatCount="indefinite"/>
      <use href="#sparkle-bean" transform="scale(0.78)"/>
    </g>
  </g>

  <!-- 2. Scholar Claude floating DOWNWARDS (y: 50 -> 2060) reading book -->
  <g>
    <animateMotion dur="29s" begin="3s" repeatCount="indefinite" path="M 40 50 V 2060"/>
    <g>
      <!-- Gentle drifting motion -->
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0; 4 0 0; -4 0 0" dur="1.4s" repeatCount="indefinite"/>
      <use href="#reader-bean" transform="scale(0.75)"/>
    </g>
  </g>

  <!-- 3. DJ Claude sliding DOWN (y: 100 -> 1950) with beats -->
  <g>
    <animateMotion dur="20s" begin="8s" repeatCount="indefinite" path="M 40 100 V 1950"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -2 0; 0 0" dur="0.45s" repeatCount="indefinite"/>
      <use href="#dj-bean" transform="scale(0.76)"/>
    </g>
  </g>
</svg>
