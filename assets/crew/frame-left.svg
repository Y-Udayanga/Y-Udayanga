        <rect x="4" y="4" width="24" height="22" fill="#F76707"/>
        <rect x="0" y="10" width="8" height="8" fill="#F76707"/>
        <rect x="24" y="10" width="8" height="8" fill="#F76707"/>
        <rect x="8" y="26" width="6" height="8" fill="#E8590C"/>
        <rect x="18" y="26" width="6" height="8" fill="#E8590C"/>
        <rect x="8" y="10" width="5" height="6" fill="#1A120E"/>
        <rect x="19" y="10" width="5" height="6" fill="#1A120E"/>
        <g transform="translate(10,16) rotate(-28)">
          <rect x="0" y="0" width="26" height="7" rx="1" fill="#7C3AED"/>
          <rect x="18" y="-3" width="10" height="13" rx="2" fill="#6D28D9"/>
