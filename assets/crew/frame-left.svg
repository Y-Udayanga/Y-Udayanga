      <circle cx="10" cy="-16" r="4.2" fill="#C17A4A" stroke="#5C3A24" stroke-width="1.4"/>
      <ellipse cx="0" cy="-2" rx="9" ry="7.5" fill="#F3D6B4"/>
      <circle cx="-4.5" cy="-6" r="2.1" fill="#2A1A12"/>
