      <ellipse cx="23" cy="3" rx="8" ry="5.2" fill="#C45C38" stroke="#2A1A12" stroke-width="1.8"/>
      <ellipse cx="0" cy="1" rx="21" ry="18.5" fill="#C45C38" stroke="#2A1A12" stroke-width="2"/>
      <ellipse cx="-11" cy="5" rx="4.2" ry="2.3" fill="#E88978" opacity=".75"/>
      <ellipse cx="11" cy="5" rx="4.2" ry="2.3" fill="#E88978" opacity=".75"/>
      <rect x="-11.5" y="-8" width="7" height="11" rx="1.4" fill="#1A120E"/>
      <rect x="4.5" y="-8" width="7" height="11" rx="1.4" fill="#1A120E"/>
      <ellipse cx="-8" cy="20" rx="3.3" ry="6.5" fill="#C45C38" stroke="#2A1A12" stroke-width="1.8"/>
      <ellipse cx="0" cy="21" rx="3.3" ry="6.8" fill="#C45C38" stroke="#2A1A12" stroke-width="1.8"/>
