<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 85" width="100%" height="85" role="img" aria-label="Claude AI crew running, greeting, and playing along the top frame">
  <defs>
    <!-- 1. CLASSIC SPARKLE CLAUDE BEAN -->
    <g id="sparkle-bean">
      <ellipse cx="-20" cy="1" rx="8" ry="4.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="20" cy="1" rx="8" ry="4.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="19" ry="16.5" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="0" cy="3" rx="13" ry="9.5" fill="#E88266" opacity="0.35"/>
      <ellipse cx="-10.5" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10.5" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-10.5" y="-8" width="6" height="10" rx="1.8" fill="#1C130E"/>
      <rect x="4.5" y="-8" width="6" height="10" rx="1.8" fill="#1C130E"/>
      <circle cx="-8" cy="-5" r="1.4" fill="#FFFFFF"/>
      <circle cx="7" cy="-5" r="1.4" fill="#FFFFFF"/>
      <path d="M-3.5 5 Q0 8.5 3.5 5" stroke="#1C130E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-10.5" cy="17" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3.5" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="3.5" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10.5" cy="17" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <path d="M-24 -12 Q-24 -8 -28 -8 Q-24 -8 -24 -4 Q-24 -8 -20 -8 Q-24 -8 -24 -12" fill="#FBBF24">
        <animateTransform attributeName="transform" type="rotate" values="0 -24 -8; 360 -24 -8" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M24 -12 Q24 -8 20 -8 Q24 -8 24 -4 Q24 -8 28 -8 Q24 -8 24 -12" fill="#F59E0B">
        <animateTransform attributeName="transform" type="rotate" values="360 24 -8; 0 24 -8" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 2. CHEF CLAUDE BEAN FLIPPING PANCAKE -->
    <g id="chef-bean">
      <!-- Puffy Chef Hat -->
      <g transform="translate(0, -16)">
        <path d="M-12 -14 C-15 -23 -2 -28 0 -19 C3 -28 16 -23 13 -14 C16 -10 14 -3 10 -3 L-10 -3 C-13 -3 -15 -10 -12 -14 Z" fill="#FFFFFF" stroke="#261710" stroke-width="1.8"/>
        <rect x="-10" y="-3.5" width="20" height="6" rx="1.8" fill="#F1F5F9" stroke="#261710" stroke-width="1.6"/>
        <line x1="-4" y1="-15" x2="-3" y2="-5" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="3" y1="-16" x2="2" y2="-5" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <ellipse cx="-20" cy="1" rx="8" ry="4.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="18.5" ry="16" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="-10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-10.5" y="-6" width="6" height="10" rx="1.8" fill="#1C130E"/>
      <circle cx="-8" cy="-3.5" r="1.3" fill="#FFFFFF"/>
      <path d="M3 -2 L10 -5 L10 -1 Z" fill="#1C130E"/>
      <path d="M-3 5 Q0 8.5 3 5" stroke="#1C130E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-10" cy="17" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3.5" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="3.5" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10" cy="17" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <!-- Frying pan & flipping pancake -->
      <g transform="translate(17, 1)">
        <ellipse cx="12" cy="-2" rx="9" ry="3.5" fill="#334155" stroke="#1E293B" stroke-width="1.4"/>
        <line x1="3" y1="-1" x2="-4" y2="1" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="12 -3; 12 -20; 12 -3" dur="1.2s" repeatCount="indefinite" />
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0; 180; 360" dur="1.2s" repeatCount="indefinite" />
            <ellipse cx="0" cy="0" rx="5.8" ry="2.5" fill="#F59E0B" stroke="#D97706" stroke-width="0.9"/>
            <rect x="-1.8" y="-1.2" width="3.6" height="2" rx="0.5" fill="#FDE68A"/>
          </g>
        </g>
      </g>
    </g>

    <!-- 3. DJ / HEADPHONE CLAUDE BEAN -->
    <g id="dj-bean">
      <path d="M-17 -5 C-19 -19 19 -19 17 -5" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="-22" y="-9" width="7" height="13" rx="3" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.4"/>
      <rect x="15" y="-9" width="7" height="13" rx="3" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.4"/>
      <ellipse cx="0" cy="2" rx="18.5" ry="16" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="-10" cy="5" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10" cy="5" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <path d="M-11 -2 Q-8 -6 -5 -2" stroke="#1C130E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M5 -2 Q8 -6 11 -2" stroke="#1C130E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M-3 5 Q0 8 3 5" stroke="#1C130E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-18" cy="4" rx="6" ry="4.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="18" cy="4" rx="6" ry="4.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-10" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3.5" cy="19" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="3.5" cy="19" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <g fill="#38BDF8">
        <text x="-23" y="-16" font-family="sans-serif" font-size="11" font-weight="bold">♪</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; -2 -5; 0 0" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <g fill="#818CF8">
        <text x="16" y="-16" font-family="sans-serif" font-size="11" font-weight="bold">♫</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 2 -5; 0 0" dur="1.1s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 4. LO-FI PIXEL ROCKER CLAUDE -->
    <g id="pixel-guitarist">
      <rect x="-12" y="-10" width="24" height="21" fill="#E06A3B"/>
      <rect x="-17" y="-2" width="6" height="8" fill="#E06A3B"/>
      <rect x="11" y="-2" width="6" height="8" fill="#E06A3B"/>
      <rect x="-12" y="-10" width="24" height="2.5" fill="#F97316"/>
      <rect x="-12" y="8.5" width="24" height="2.5" fill="#B45309"/>
      <rect x="-8" y="-5" width="4.5" height="6" fill="#18181B"/>
      <rect x="3.5" y="-5" width="4.5" height="6" fill="#18181B"/>
      <rect x="-7" y="-4" width="1.8" height="1.8" fill="#FFFFFF"/>
      <rect x="4.5" y="-4" width="1.8" height="1.8" fill="#FFFFFF"/>
      <rect x="-9" y="11" width="5" height="9" fill="#E06A3B"/>
      <rect x="3.5" y="11" width="5" height="9" fill="#E06A3B"/>
      <g transform="translate(-3, 2) rotate(-22)">
        <path d="M-9 5 C-13 1 -16 9 -12 14 C-9 19 -3 18 2 15 C6 11 3 4 -2 4 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="1.2"/>
        <ellipse cx="-5" cy="10" rx="3.5" ry="2.6" fill="#9333EA"/>
        <rect x="1" y="-14" width="2.8" height="19" fill="#D4D4D8" stroke="#3F3F46" stroke-width="0.7"/>
        <path d="M1 -14 L4 -16.5 L4 -12 Z" fill="#7C3AED"/>
        <line x1="2" y1="-14" x2="0" y2="13" stroke="#FFFFFF" stroke-width="0.5" opacity="0.8"/>
      </g>
      <rect x="-1" y="4" width="4" height="4" rx="1" fill="#E06A3B"/>
      <g fill="#A855F7">
        <text x="16" y="-11" font-family="monospace" font-size="10" font-weight="bold">♪</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 2 -4; 0 0" dur="0.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 5. CODER CUBE CLAUDE -->
    <g id="cube-buddy">
      <g transform="translate(-14, -5)">
        <rect x="0" y="0" width="8" height="16" rx="3" fill="#854D0E" stroke="#583101" stroke-width="1.2"/>
      </g>
      <polygon points="-14,-10 7,-15 17,-8 -3,-3" fill="#F97316"/>
      <polygon points="-3,-3 17,-8 17,11 -3,15" fill="#B45309" stroke="#78350F" stroke-width="1"/>
      <rect x="-16" y="-5" width="21" height="21" rx="3.5" fill="#EA580C" stroke="#78350F" stroke-width="1.4"/>
      <ellipse cx="-11" cy="2.5" rx="2.6" ry="3.5" fill="#18181B"/>
      <ellipse cx="-2" cy="2.5" rx="2.6" ry="3.5" fill="#18181B"/>
      <circle cx="-12" cy="1.2" r="1.1" fill="#FFFFFF"/>
      <circle cx="-3" cy="1.2" r="1.1" fill="#FFFFFF"/>
      <path d="M-8 8 Q-6 10.5 -4 8" stroke="#18181B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="-13" cy="6" rx="1.8" ry="1" fill="#FECDD3"/>
      <ellipse cx="0" cy="6" rx="1.8" ry="1" fill="#FECDD3"/>
      <rect x="-12" y="16" width="4.5" height="6" rx="1.5" fill="#C2410C"/>
      <rect x="-4" y="16" width="4.5" height="6" rx="1.5" fill="#C2410C"/>
      <g transform="translate(-24, -3)">
        <rect x="0" y="0" width="11" height="15" rx="1.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
        <text x="5.5" y="10" font-family="monospace" font-weight="900" font-size="6.5" fill="#10B981" text-anchor="middle">&lt;/&gt;</text>
      </g>
      <g transform="translate(3, -2)">
        <ellipse cx="3.5" cy="4" rx="2.5" ry="2.5" fill="#EA580C"/>
        <rect x="2.5" y="-2" width="2" height="5" rx="1" fill="#EA580C"/>
      </g>
    </g>

    <!-- 6. SCHOLAR / READER CLAUDE -->
    <g id="reader-bean">
      <ellipse cx="0" cy="0" rx="18.5" ry="16" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="-10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-10" y="-7" width="5.5" height="8" rx="1.8" fill="#1C130E"/>
      <rect x="4" y="-7" width="5.5" height="8" rx="1.8" fill="#1C130E"/>
      <circle cx="-7.5" cy="-4" r="1.3" fill="#FFFFFF"/>
      <circle cx="6.5" cy="-4" r="1.3" fill="#FFFFFF"/>
      <g transform="translate(0, 6)">
        <path d="M-13 -3 L0 -1 L13 -3 L13 9 L0 11 L-13 9 Z" fill="#059669" stroke="#064E3B" stroke-width="1.2"/>
        <path d="M-12 -3 L-1 -1 L-1 10 L-12 8 Z" fill="#FFFFFF"/>
        <path d="M12 -3 L1 -1 L1 10 L12 8 Z" fill="#FFFFFF"/>
      </g>
      <ellipse cx="-10" cy="17" rx="3" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3.5" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="3.5" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10" cy="17" rx="3" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <g transform="translate(0, -19)">
        <circle cx="0" cy="0" r="4" fill="#FBBF24" stroke="#D97706" stroke-width="0.9"/>
        <rect x="-1.5" y="3.5" width="3" height="1.8" fill="#78716C"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>
  </defs>

  <!-- ================= RUNWAY / TRACK ================= -->
  <!-- Perfectly aligned with 854px container width -->
  <line x1="16" y1="68" x2="838" y2="68" stroke="#21262D" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="16" y1="68" x2="838" y2="68" stroke="#58A6FF" stroke-width="1.8" stroke-dasharray="10 16" stroke-linecap="round" opacity="0.65">
    <animate attributeName="stroke-dashoffset" values="0; -26" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <circle cx="20" cy="68" r="3.2" fill="#58A6FF" opacity="0.8"/>
  <circle cx="220" cy="68" r="2.5" fill="#38BDF8" opacity="0.5"/>
  <circle cx="427" cy="68" r="3.5" fill="#A855F7" opacity="0.8"/>
  <circle cx="634" cy="68" r="2.5" fill="#38BDF8" opacity="0.5"/>
  <circle cx="834" cy="68" r="3.2" fill="#58A6FF" opacity="0.8"/>

  <!-- ================= ANIMATED CAST CHOREOGRAPHY ================= -->

  <!-- 1. Coder Cube running Right (x: 35 -> 805) -->
  <g>
    <animateMotion dur="16s" repeatCount="indefinite" path="M 35 48 H 805"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="0.42s" repeatCount="indefinite"/>
      <use href="#cube-buddy" transform="scale(0.92)"/>
    </g>
  </g>

  <!-- 2. Chef Claude Bean running Left (x: 805 -> 35) flipping pancakes -->
  <g>
    <animateMotion dur="18s" begin="1.2s" repeatCount="indefinite" path="M 805 48 H 35"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.38s" repeatCount="indefinite"/>
      <use href="#chef-bean" transform="scale(-0.9, 0.9)"/>
    </g>
  </g>

  <!-- 3. Classic Sparkle Bean sprinting Right (x: 45 -> 795) -->
  <g>
    <animateMotion dur="14s" begin="2.5s" repeatCount="indefinite" path="M 45 48 H 795"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="0.32s" repeatCount="indefinite"/>
      <use href="#sparkle-bean" transform="scale(0.9)"/>
    </g>
  </g>

  <!-- 4. Lofi Pixel Rocker jamming along the track (x: 60 -> 780) -->
  <g>
    <animateMotion dur="22s" begin="0.5s" repeatCount="indefinite" path="M 60 48 H 780"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.48s" repeatCount="indefinite"/>
      <use href="#pixel-guitarist" transform="scale(0.98)"/>
    </g>
  </g>

  <!-- 5. DJ Headphone Claude gliding Left (x: 790 -> 50) -->
  <g>
    <animateMotion dur="17s" begin="3.8s" repeatCount="indefinite" path="M 790 46 H 50"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0; 4 0 0; -4 0 0" dur="0.65s" repeatCount="indefinite"/>
      <use href="#dj-bean" transform="scale(-0.88, 0.88)"/>
    </g>
  </g>

  <!-- 6. Scholar Claude strolling Right (x: 80 -> 760) -->
  <g>
    <animateMotion dur="25s" begin="1.8s" repeatCount="indefinite" path="M 80 48 H 760"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.55s" repeatCount="indefinite"/>
      <use href="#reader-bean" transform="scale(0.85)"/>
    </g>
  </g>

  <!-- ================= GREETING SPEECH BUBBLES ================= -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.22;0.35;0.40;1" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(200, 6)">
      <rect x="0" y="0" width="112" height="22" rx="11" fill="#161B22" stroke="#F59E0B" stroke-width="1.3"/>
      <polygon points="35,22 41,27 43,22" fill="#161B22"/>
      <text x="56" y="15" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#FBBF24">Cooking code! 🥞</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.40;0.58;0.64;1" dur="22s" repeatCount="indefinite"/>
    <g transform="translate(370, 6)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="#161B22" stroke="#A855F7" stroke-width="1.3"/>
      <polygon points="60,22 65,27 68,22" fill="#161B22"/>
      <text x="60" y="15" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#C084FC">Solo mode on! 🎸</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.55;0.72;0.78;1" dur="16s" repeatCount="indefinite"/>
    <g transform="translate(580, 6)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="#161B22" stroke="#38BDF8" stroke-width="1.3"/>
      <polygon points="45,22 50,27 53,22" fill="#161B22"/>
      <text x="60" y="15" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8">Clean commits! 🚀</text>
    </g>
  </g>
</svg>
