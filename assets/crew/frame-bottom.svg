<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 85" width="100%" height="85" role="img" aria-label="Claude AI crew celebrating, dancing, and thanking visitors along the bottom frame">
  <defs>
    <!-- 1. CLASSIC SPARKLE CLAUDE BEAN -->
    <g id="sparkle-bean">
      <ellipse cx="-20" cy="1" rx="8" ry="4.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="20" cy="1" rx="8" ry="4.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="19" ry="16.5" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="0" cy="3" rx="13" ry="9.5" fill="#E88266" opacity="0.35"/>
      <ellipse cx="-10.5" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10.5" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-10.5" y="-8" width="6" height="10" rx="1.8" fill="#1C130E"/>
      <rect x="4.5" y="-8" width="6" height="10" rx="1.8" fill="#1C130E"/>
      <circle cx="-8" cy="-5" r="1.4" fill="#FFFFFF"/>
      <circle cx="7" cy="-5" r="1.4" fill="#FFFFFF"/>
      <path d="M-3.5 5 Q0 8.5 3.5 5" stroke="#1C130E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-10.5" cy="17" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3.5" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="3.5" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10.5" cy="17" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <path d="M-24 -12 Q-24 -8 -28 -8 Q-24 -8 -24 -4 Q-24 -8 -20 -8 Q-24 -8 -24 -12" fill="#FBBF24">
        <animateTransform attributeName="transform" type="rotate" values="0 -24 -8; 360 -24 -8" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M24 -12 Q24 -8 20 -8 Q24 -8 24 -4 Q24 -8 28 -8 Q24 -8 24 -12" fill="#F59E0B">
        <animateTransform attributeName="transform" type="rotate" values="360 24 -8; 0 24 -8" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 2. DJ / HEADPHONE CLAUDE BEAN -->
    <g id="dj-bean">
      <path d="M-17 -5 C-19 -19 19 -19 17 -5" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="-22" y="-9" width="7" height="13" rx="3" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.4"/>
      <rect x="15" y="-9" width="7" height="13" rx="3" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.4"/>
      <ellipse cx="0" cy="2" rx="18.5" ry="16" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="-10" cy="5" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10" cy="5" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <path d="M-11 -2 Q-8 -6 -5 -2" stroke="#1C130E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M5 -2 Q8 -6 11 -2" stroke="#1C130E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M-3 5 Q0 8 3 5" stroke="#1C130E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-18" cy="4" rx="6" ry="4.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="18" cy="4" rx="6" ry="4.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-10" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3.5" cy="19" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="3.5" cy="19" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <g fill="#38BDF8">
        <text x="-23" y="-16" font-family="sans-serif" font-size="11" font-weight="bold">♪</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; -2 -5; 0 0" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <g fill="#EC4899">
        <text x="16" y="-16" font-family="sans-serif" font-size="11" font-weight="bold">♬</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 2 -5; 0 0" dur="1.1s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 3. CHEF CLAUDE BEAN SERVING TREATS -->
    <g id="chef-bean">
      <g transform="translate(0, -16)">
        <path d="M-12 -14 C-15 -23 -2 -28 0 -19 C3 -28 16 -23 13 -14 C16 -10 14 -3 10 -3 L-10 -3 C-13 -3 -15 -10 -12 -14 Z" fill="#FFFFFF" stroke="#261710" stroke-width="1.8"/>
        <rect x="-10" y="-3.5" width="20" height="6" rx="1.8" fill="#F1F5F9" stroke="#261710" stroke-width="1.6"/>
      </g>
      <ellipse cx="-20" cy="1" rx="8" ry="4.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="18.5" ry="16" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="-10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-10.5" y="-6" width="6" height="10" rx="1.8" fill="#1C130E"/>
      <circle cx="-8" cy="-3.5" r="1.3" fill="#FFFFFF"/>
      <path d="M3 -2 L10 -5 L10 -1 Z" fill="#1C130E"/>
      <path d="M-3 5 Q0 8.5 3 5" stroke="#1C130E" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-10" cy="17" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3.5" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="3.5" cy="18" rx="3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10" cy="17" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <g transform="translate(16, 2)">
        <ellipse cx="10" cy="0" rx="12" ry="3.5" fill="#94A3B8" stroke="#475569" stroke-width="1.2"/>
        <circle cx="5" cy="-2" r="2.5" fill="#D97706"/>
        <circle cx="10" cy="-3" r="2.8" fill="#B45309"/>
        <circle cx="15" cy="-2" r="2.5" fill="#D97706"/>
      </g>
    </g>

    <!-- 4. LO-FI PIXEL ROCKER -->
    <g id="pixel-guitarist">
      <rect x="-12" y="-10" width="24" height="21" fill="#E06A3B"/>
      <rect x="-17" y="-2" width="6" height="8" fill="#E06A3B"/>
      <rect x="11" y="-2" width="6" height="8" fill="#E06A3B"/>
      <rect x="-12" y="-10" width="24" height="2.5" fill="#F97316"/>
      <rect x="-12" y="8.5" width="24" height="2.5" fill="#B45309"/>
      <rect x="-8" y="-5" width="4.5" height="6" fill="#18181B"/>
      <rect x="3.5" y="-5" width="4.5" height="6" fill="#18181B"/>
      <rect x="-7" y="-4" width="1.8" height="1.8" fill="#FFFFFF"/>
      <rect x="4.5" y="-4" width="1.8" height="1.8" fill="#FFFFFF"/>
      <rect x="-9" y="11" width="5" height="9" fill="#E06A3B"/>
      <rect x="3.5" y="11" width="5" height="9" fill="#E06A3B"/>
      <g transform="translate(-3, 2) rotate(-22)">
        <path d="M-9 5 C-13 1 -16 9 -12 14 C-9 19 -3 18 2 15 C6 11 3 4 -2 4 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="1.2"/>
        <ellipse cx="-5" cy="10" rx="3.5" ry="2.6" fill="#9333EA"/>
        <rect x="1" y="-14" width="2.8" height="19" fill="#D4D4D8" stroke="#3F3F46" stroke-width="0.7"/>
        <path d="M1 -14 L4 -16.5 L4 -12 Z" fill="#7C3AED"/>
      </g>
      <rect x="-1" y="4" width="4" height="4" rx="1" fill="#E06A3B"/>
      <g fill="#A855F7">
        <text x="16" y="-11" font-family="monospace" font-size="10" font-weight="bold">♪</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 2 -4; 0 0" dur="0.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 5. CODER CUBE -->
    <g id="cube-buddy">
      <g transform="translate(-14, -5)">
        <rect x="0" y="0" width="8" height="16" rx="3" fill="#854D0E" stroke="#583101" stroke-width="1.2"/>
      </g>
      <polygon points="-14,-10 7,-15 17,-8 -3,-3" fill="#F97316"/>
      <polygon points="-3,-3 17,-8 17,11 -3,15" fill="#B45309" stroke="#78350F" stroke-width="1"/>
      <rect x="-16" y="-5" width="21" height="21" rx="3.5" fill="#EA580C" stroke="#78350F" stroke-width="1.4"/>
      <ellipse cx="-11" cy="2.5" rx="2.6" ry="3.5" fill="#18181B"/>
      <ellipse cx="-2" cy="2.5" rx="2.6" ry="3.5" fill="#18181B"/>
      <circle cx="-12" cy="1.2" r="1.1" fill="#FFFFFF"/>
      <circle cx="-3" cy="1.2" r="1.1" fill="#FFFFFF"/>
      <path d="M-8 8 Q-6 10.5 -4 8" stroke="#18181B" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="-13" cy="6" rx="1.8" ry="1" fill="#FECDD3"/>
      <ellipse cx="0" cy="6" rx="1.8" ry="1" fill="#FECDD3"/>
      <rect x="-12" y="16" width="4.5" height="6" rx="1.5" fill="#C2410C"/>
      <rect x="-4" y="16" width="4.5" height="6" rx="1.5" fill="#C2410C"/>
      <g transform="translate(-28, -7)">
        <rect x="0" y="0" width="16" height="12" rx="2" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
        <text x="8" y="8.5" font-family="sans-serif" font-weight="bold" font-size="5.5" fill="#38BDF8" text-anchor="middle">★ THANKS</text>
      </g>
    </g>

    <!-- 6. READER / SCHOLAR CLAUDE -->
    <g id="reader-bean">
      <ellipse cx="0" cy="0" rx="18.5" ry="16" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="-10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="10" cy="4" rx="4" ry="2.2" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-10" y="-7" width="5.5" height="8" rx="1.8" fill="#1C130E"/>
      <rect x="4" y="-7" width="5.5" height="8" rx="1.8" fill="#1C130E"/>
      <circle cx="-7.5" cy="-4" r="1.3" fill="#FFFFFF"/>
      <circle cx="6.5" cy="-4" r="1.3" fill="#FFFFFF"/>
      <g transform="translate(0, 6)">
        <path d="M-13 -3 L0 -1 L13 -3 L13 9 L0 11 L-13 9 Z" fill="#059669" stroke="#064E3B" stroke-width="1.2"/>
        <path d="M-12 -3 L-1 -1 L-1 10 L-12 8 Z" fill="#FFFFFF"/>
        <path d="M12 -3 L1 -1 L1 10 L12 8 Z" fill="#FFFFFF"/>
      </g>
      <ellipse cx="-10" cy="17" rx="3" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="-3.5" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="3.5" cy="18" rx="3" ry="6" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
      <ellipse cx="10" cy="17" rx="3" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- ================= RUNWAY / TRACK ================= -->
  <line x1="16" y1="20" x2="838" y2="20" stroke="#21262D" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="16" y1="20" x2="838" y2="20" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="10 16" stroke-linecap="round" opacity="0.65">
    <animate attributeName="stroke-dashoffset" values="-26; 0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <circle cx="20" cy="20" r="3.2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="427" cy="20" r="3.5" fill="#EC4899" opacity="0.8"/>
  <circle cx="834" cy="20" r="3.2" fill="#F59E0B" opacity="0.8"/>

  <!-- ================= ANIMATED CAST CHOREOGRAPHY ================= -->

  <!-- 1. DJ Claude grooving Right (x: 35 -> 805) -->
  <g>
    <animateMotion dur="15s" repeatCount="indefinite" path="M 35 48 H 805"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0; 5 0 0; -5 0 0" dur="0.6s" repeatCount="indefinite"/>
      <use href="#dj-bean" transform="scale(0.9)"/>
    </g>
  </g>

  <!-- 2. Classic Sparkle Bean dancing Left (x: 805 -> 35) -->
  <g>
    <animateMotion dur="14s" begin="1s" repeatCount="indefinite" path="M 805 48 H 35"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="0.34s" repeatCount="indefinite"/>
      <use href="#sparkle-bean" transform="scale(-0.9, 0.9)"/>
    </g>
  </g>

  <!-- 3. Chef Claude walking Right (x: 45 -> 790) -->
  <g>
    <animateMotion dur="19s" begin="2s" repeatCount="indefinite" path="M 45 48 H 790"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.42s" repeatCount="indefinite"/>
      <use href="#chef-bean" transform="scale(0.88)"/>
    </g>
  </g>

  <!-- 4. Lofi Rocker jamming Left (x: 800 -> 50) -->
  <g>
    <animateMotion dur="21s" begin="2.8s" repeatCount="indefinite" path="M 800 48 H 50"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.45s" repeatCount="indefinite"/>
      <use href="#pixel-guitarist" transform="scale(-0.95, 0.95)"/>
    </g>
  </g>

  <!-- 5. Coder Cube jogging Right (x: 60 -> 795) -->
  <g>
    <animateMotion dur="17s" begin="3.5s" repeatCount="indefinite" path="M 60 48 H 795"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.38s" repeatCount="indefinite"/>
      <use href="#cube-buddy" transform="scale(0.9)"/>
    </g>
  </g>

  <!-- 6. Scholar Claude strolling Left (x: 770 -> 70) -->
  <g>
    <animateMotion dur="23s" begin="4.5s" repeatCount="indefinite" path="M 770 48 H 70"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.52s" repeatCount="indefinite"/>
      <use href="#reader-bean" transform="scale(-0.85, 0.85)"/>
    </g>
  </g>

  <!-- ================= CELEBRATION SPEECH BUBBLES ================= -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.35;0.52;0.58;1" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(280, 60)">
      <rect x="0" y="0" width="140" height="22" rx="11" fill="#161B22" stroke="#EC4899" stroke-width="1.3"/>
      <polygon points="65,0 70,-4 73,0" fill="#161B22"/>
      <text x="70" y="15" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#F472B6">Thanks for visiting! 💖</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.50;0.68;0.74;1" dur="15s" repeatCount="indefinite"/>
    <g transform="translate(540, 60)">
      <rect x="0" y="0" width="130" height="22" rx="11" fill="#161B22" stroke="#38BDF8" stroke-width="1.3"/>
      <polygon points="55,0 60,-4 63,0" fill="#161B22"/>
      <text x="65" y="15" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8">Keep on building! ⚡</text>
    </g>
  </g>
</svg>
