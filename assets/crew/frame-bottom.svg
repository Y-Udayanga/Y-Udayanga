<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 100" width="920" height="100" role="img" aria-label="Claude AI crew celebrating, dancing, and thanking visitors along the bottom frame">
  <defs>
    <!-- 1. CLASSIC SPARKLE CLAUDE BEAN -->
    <g id="sparkle-bean">
      <ellipse cx="-23" cy="2" rx="9" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="23" cy="2" rx="9" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="22" ry="19" fill="#C45C38" stroke="#261710" stroke-width="2.2"/>
      <ellipse cx="0" cy="4" rx="15" ry="11" fill="#E88266" opacity="0.35"/>
      <ellipse cx="-12" cy="5" rx="4.5" ry="2.5" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="12" cy="5" rx="4.5" ry="2.5" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-12" y="-9" width="7" height="12" rx="2" fill="#1C130E"/>
      <rect x="5" y="-9" width="7" height="12" rx="2" fill="#1C130E"/>
      <circle cx="-9" cy="-6" r="1.6" fill="#FFFFFF"/>
      <circle cx="8" cy="-6" r="1.6" fill="#FFFFFF"/>
      <path d="M-4 6 Q0 10 4 6" stroke="#1C130E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <ellipse cx="-12" cy="20" rx="3.5" ry="7" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="-4" cy="21" rx="3.5" ry="7.5" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="4" cy="21" rx="3.5" ry="7.5" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="12" cy="20" rx="3.5" ry="7" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <path d="M-28 -14 Q-28 -9 -33 -9 Q-28 -9 -28 -4 Q-28 -9 -23 -9 Q-28 -9 -28 -14" fill="#FBBF24">
        <animateTransform attributeName="transform" type="rotate" values="0 -28 -9; 180 -28 -9; 360 -28 -9" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M28 -14 Q28 -9 23 -9 Q28 -9 28 -4 Q28 -9 33 -9 Q28 -9 28 -14" fill="#F59E0B">
        <animateTransform attributeName="transform" type="rotate" values="360 28 -9; 180 28 -9; 0 28 -9" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 2. DJ / HEADPHONE CLAUDE BEAN -->
    <g id="dj-bean">
      <path d="M-19 -6 C-21 -22 21 -22 19 -6" stroke="#475569" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M-18 -6 C-20 -20 20 -20 18 -6" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="-25" y="-10" width="8" height="15" rx="3.5" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.6"/>
      <rect x="-23" y="-7" width="4" height="9" rx="1.5" fill="#60A5FA"/>
      <rect x="17" y="-10" width="8" height="15" rx="3.5" fill="#2563EB" stroke="#1E3A8A" stroke-width="1.6"/>
      <rect x="19" y="-7" width="4" height="9" rx="1.5" fill="#60A5FA"/>
      <ellipse cx="0" cy="2" rx="21" ry="18" fill="#C45C38" stroke="#261710" stroke-width="2.2"/>
      <ellipse cx="-11" cy="6" rx="4.5" ry="2.5" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="11" cy="6" rx="4.5" ry="2.5" fill="#FF8D7A" opacity="0.85"/>
      <path d="M-13 -3 Q-9 -8 -5 -3" stroke="#1C130E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M5 -3 Q9 -8 13 -3" stroke="#1C130E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M-3 6 Q0 9 3 6" stroke="#1C130E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <ellipse cx="-21" cy="5" rx="7" ry="5" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="21" cy="5" rx="7" ry="5" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="-11" cy="21" rx="3.3" ry="6.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="-4" cy="22" rx="3.3" ry="7.2" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="4" cy="22" rx="3.3" ry="7.2" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="11" cy="21" rx="3.3" ry="6.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <g fill="#38BDF8">
        <text x="-26" y="-18" font-family="sans-serif" font-size="13" font-weight="bold">♪</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; -2 -6; 0 0" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <g fill="#EC4899">
        <text x="18" y="-18" font-family="sans-serif" font-size="13" font-weight="bold">♬</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 2 -6; 0 0" dur="1.1s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 3. CHEF CLAUDE BEAN SERVING TREATS -->
    <g id="chef-bean">
      <g transform="translate(0, -18)">
        <path d="M-14 -16 C-17 -26 -2 -32 0 -22 C4 -32 18 -26 15 -16 C18 -12 16 -4 12 -4 L-11 -4 C-15 -4 -17 -12 -14 -16 Z" fill="#FFFFFF" stroke="#261710" stroke-width="2"/>
        <rect x="-12" y="-4" width="24" height="7" rx="2" fill="#F1F5F9" stroke="#261710" stroke-width="1.8"/>
      </g>
      <ellipse cx="-23" cy="2" rx="9" ry="5.5" fill="#C45C38" stroke="#261710" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="21" ry="18" fill="#C45C38" stroke="#261710" stroke-width="2.2"/>
      <ellipse cx="-11" cy="5" rx="4.5" ry="2.5" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="11" cy="5" rx="4.5" ry="2.5" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-12" y="-7" width="7" height="11" rx="2" fill="#1C130E"/>
      <circle cx="-9" cy="-4" r="1.5" fill="#FFFFFF"/>
      <path d="M4 -2 L12 -6 L12 -1 Z" fill="#1C130E"/>
      <path d="M-3 6 Q0 10 3 6" stroke="#1C130E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <ellipse cx="-11" cy="19" rx="3.3" ry="6.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="-4" cy="20" rx="3.3" ry="7.2" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="4" cy="20" rx="3.3" ry="7.2" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="11" cy="19" rx="3.3" ry="6.8" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <!-- Serving Tray with Warm Cookies -->
      <g transform="translate(18, 3)">
        <ellipse cx="12" cy="0" rx="14" ry="4" fill="#94A3B8" stroke="#475569" stroke-width="1.4"/>
        <circle cx="6" cy="-2" r="3" fill="#D97706"/>
        <circle cx="12" cy="-3" r="3.2" fill="#B45309"/>
        <circle cx="18" cy="-2" r="3" fill="#D97706"/>
        <circle cx="12" cy="-4" r="0.8" fill="#451A03"/>
        <circle cx="6" cy="-3" r="0.7" fill="#451A03"/>
      </g>
    </g>

    <!-- 4. LO-FI PIXEL ROCKER -->
    <g id="pixel-guitarist">
      <rect x="-14" y="-12" width="28" height="24" fill="#E06A3B"/>
      <rect x="-20" y="-3" width="7" height="9" fill="#E06A3B"/>
      <rect x="13" y="-3" width="7" height="9" fill="#E06A3B"/>
      <rect x="-14" y="-12" width="28" height="3" fill="#F97316"/>
      <rect x="-14" y="9" width="28" height="3" fill="#B45309"/>
      <rect x="-9" y="-6" width="5" height="7" fill="#18181B"/>
      <rect x="4" y="-6" width="5" height="7" fill="#18181B"/>
      <rect x="-8" y="-5" width="2" height="2" fill="#FFFFFF"/>
      <rect x="5" y="-5" width="2" height="2" fill="#FFFFFF"/>
      <rect x="-10" y="12" width="6" height="10" fill="#E06A3B"/>
      <rect x="4" y="12" width="6" height="10" fill="#E06A3B"/>
      <g transform="translate(-4, 3) rotate(-22)">
        <path d="M-10 6 C-15 1 -18 10 -14 16 C-10 22 -3 21 3 17 C8 13 4 5 -2 5 Z" fill="#7C3AED" stroke="#4C1D95" stroke-width="1.4"/>
        <ellipse cx="-6" cy="12" rx="4" ry="3" fill="#9333EA"/>
        <rect x="-4" y="9" width="4" height="2" fill="#E2E8F0"/>
        <rect x="-2" y="12" width="4" height="2" fill="#E2E8F0"/>
        <circle cx="0" cy="16" r="1.2" fill="#F8FAFC"/>
        <rect x="1" y="-16" width="3.2" height="22" fill="#D4D4D8" stroke="#3F3F46" stroke-width="0.8"/>
        <path d="M1 -16 L5 -19 L5 -14 Z" fill="#7C3AED"/>
        <circle cx="1" cy="-17" r="0.9" fill="#F1F5F9"/>
        <circle cx="5" cy="-17" r="0.9" fill="#F1F5F9"/>
        <line x1="2" y1="-16" x2="0" y2="15" stroke="#FFFFFF" stroke-width="0.5" opacity="0.8"/>
        <path d="M-12 7 C-18 -4 -8 -11 0 -7" stroke="#312E81" stroke-width="1.8" fill="none"/>
      </g>
      <rect x="-1" y="5" width="4.5" height="4.5" rx="1" fill="#E06A3B"/>
      <g fill="#A855F7">
        <rect x="18" y="-14" width="3" height="7"/>
        <rect x="23" y="-16" width="3" height="7"/>
        <rect x="18" y="-16" width="8" height="3"/>
        <rect x="16" y="-9" width="5" height="3"/>
        <rect x="21" y="-11" width="5" height="3"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 3 -5; 0 0" dur="0.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 5. CODER CUBE WITH THANK-YOU BANNER -->
    <g id="cube-buddy">
      <g transform="translate(-16, -6)">
        <rect x="0" y="0" width="10" height="18" rx="3.5" fill="#854D0E" stroke="#583101" stroke-width="1.4"/>
        <rect x="2" y="3" width="6" height="5" rx="1" fill="#A16207"/>
      </g>
      <polygon points="-16,-12 8,-17 20,-9 -4,-4" fill="#F97316"/>
      <polygon points="-4,-4 20,-9 20,13 -4,18" fill="#B45309" stroke="#78350F" stroke-width="1.2"/>
      <rect x="-18" y="-6" width="24" height="24" rx="4" fill="#EA580C" stroke="#78350F" stroke-width="1.6"/>
      <ellipse cx="-12" cy="3" rx="3" ry="4" fill="#18181B"/>
      <ellipse cx="-2" cy="3" rx="3" ry="4" fill="#18181B"/>
      <circle cx="-13" cy="1.5" r="1.3" fill="#FFFFFF"/>
      <circle cx="-3" cy="1.5" r="1.3" fill="#FFFFFF"/>
      <path d="M-9 9 Q-7 12 -5 9" stroke="#18181B" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-15" cy="7" rx="2" ry="1.2" fill="#FECDD3"/>
      <ellipse cx="1" cy="7" rx="2" ry="1.2" fill="#FECDD3"/>
      <rect x="-14" y="18" width="5" height="7" rx="2" fill="#C2410C" stroke="#78350F" stroke-width="1.2"/>
      <rect x="-5" y="18" width="5" height="7" rx="2" fill="#C2410C" stroke="#78350F" stroke-width="1.2"/>
      <!-- Holding Thank-You Mini Banner -->
      <g transform="translate(-32, -8)">
        <rect x="0" y="0" width="18" height="13" rx="2" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
        <text x="9" y="9" font-family="sans-serif" font-weight="bold" font-size="6.5" fill="#38BDF8" text-anchor="middle">★ THANKS</text>
      </g>
    </g>

    <!-- 6. READER / SCHOLAR CLAUDE BEAN -->
    <g id="reader-bean">
      <ellipse cx="0" cy="0" rx="21" ry="18" fill="#C45C38" stroke="#261710" stroke-width="2.2"/>
      <ellipse cx="-11" cy="5" rx="4.5" ry="2.5" fill="#FF8D7A" opacity="0.85"/>
      <ellipse cx="11" cy="5" rx="4.5" ry="2.5" fill="#FF8D7A" opacity="0.85"/>
      <rect x="-11" y="-8" width="6.5" height="9" rx="2" fill="#1C130E"/>
      <rect x="4.5" y="-8" width="6.5" height="9" rx="2" fill="#1C130E"/>
      <circle cx="-8" cy="-5" r="1.5" fill="#FFFFFF"/>
      <circle cx="7" cy="-5" r="1.5" fill="#FFFFFF"/>
      <g transform="translate(0, 7)">
        <path d="M-14 -4 L-1 -2 L-1 12 L-14 9 Z" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
        <path d="M14 -4 L1 -2 L1 12 L14 9 Z" fill="#FFFFFF" stroke="#047857" stroke-width="1.2"/>
        <path d="M-15 -3 L0 -1 L15 -3 L15 10 L0 12 L-15 10 Z" fill="#059669" stroke="#064E3B" stroke-width="1.2"/>
        <line x1="0" y1="-1" x2="0" y2="12" stroke="#064E3B" stroke-width="1.4"/>
      </g>
      <ellipse cx="-11" cy="19" rx="3.3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="-4" cy="20" rx="3.3" ry="7" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="4" cy="20" rx="3.3" ry="7" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
      <ellipse cx="11" cy="19" rx="3.3" ry="6.5" fill="#C45C38" stroke="#261710" stroke-width="1.8"/>
    </g>
  </defs>

  <!-- ================= RUNWAY / TRACK ================= -->
  <line x1="25" y1="22" x2="895" y2="22" stroke="#21262D" stroke-width="3" stroke-linecap="round"/>
  <line x1="25" y1="22" x2="895" y2="22" stroke="#F59E0B" stroke-width="2" stroke-dasharray="10 16" stroke-linecap="round" opacity="0.65">
    <animate attributeName="stroke-dashoffset" values="-26; 0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <circle cx="35" cy="22" r="3.5" fill="#F59E0B" opacity="0.7"/>
  <circle cx="460" cy="22" r="4" fill="#EC4899" opacity="0.8"/>
  <circle cx="885" cy="22" r="3.5" fill="#F59E0B" opacity="0.7"/>

  <!-- ================= ANIMATED CAST CHOREOGRAPHY ================= -->

  <!-- 1. DJ Claude grooving Right across the bottom (x: 40 -> 870) -->
  <g>
    <animateMotion dur="16s" repeatCount="indefinite" path="M 40 54 H 870"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0; 5 0 0; -5 0 0" dur="0.6s" repeatCount="indefinite"/>
      <use href="#dj-bean" transform="scale(0.95)"/>
    </g>
  </g>

  <!-- 2. Classic Sparkle Bean dancing Left across the bottom (x: 870 -> 40) -->
  <g>
    <animateMotion dur="15s" begin="1s" repeatCount="indefinite" path="M 870 54 H 40"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="0.36s" repeatCount="indefinite"/>
      <use href="#sparkle-bean" transform="scale(-0.95, 0.95)"/>
    </g>
  </g>

  <!-- 3. Chef Claude walking Right (x: 50 -> 850) carrying treats -->
  <g>
    <animateMotion dur="20s" begin="2.5s" repeatCount="indefinite" path="M 50 54 H 850"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.45s" repeatCount="indefinite"/>
      <use href="#chef-bean" transform="scale(0.92)"/>
    </g>
  </g>

  <!-- 4. Lofi Rocker jamming Left (x: 860 -> 60) -->
  <g>
    <animateMotion dur="22s" begin="3s" repeatCount="indefinite" path="M 860 54 H 60"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.48s" repeatCount="indefinite"/>
      <use href="#pixel-guitarist" transform="scale(-1.02, 1.02)"/>
    </g>
  </g>

  <!-- 5. Coder Cube jogging Right (x: 70 -> 860) with thanks banner -->
  <g>
    <animateMotion dur="18s" begin="4s" repeatCount="indefinite" path="M 70 54 H 860"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="0.4s" repeatCount="indefinite"/>
      <use href="#cube-buddy" transform="scale(0.95)"/>
    </g>
  </g>

  <!-- 6. Scholar Claude strolling Left (x: 830 -> 80) -->
  <g>
    <animateMotion dur="24s" begin="5s" repeatCount="indefinite" path="M 830 54 H 80"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.55s" repeatCount="indefinite"/>
      <use href="#reader-bean" transform="scale(-0.9, 0.9)"/>
    </g>
  </g>

  <!-- ================= CELEBRATION SPEECH BUBBLES ================= -->
  <!-- Bubble: Sparkle Bean greeting at x=340 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.35;0.52;0.58;1" dur="15s" repeatCount="indefinite"/>
    <g transform="translate(300, 68)">
      <rect x="0" y="0" width="145" height="24" rx="12" fill="#161B22" stroke="#EC4899" stroke-width="1.4"/>
      <polygon points="65,0 70,-5 73,0" fill="#161B22"/>
      <text x="72" y="16" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#F472B6">Thanks for visiting! 💖</text>
    </g>
  </g>

  <!-- Bubble: DJ Bean drop the beat at x=620 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.50;0.68;0.74;1" dur="16s" repeatCount="indefinite"/>
    <g transform="translate(580, 68)">
      <rect x="0" y="0" width="135" height="24" rx="12" fill="#161B22" stroke="#38BDF8" stroke-width="1.4"/>
      <polygon points="55,0 60,-5 63,0" fill="#161B22"/>
      <text x="67" y="16" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Keep on building! ⚡</text>
    </g>
  </g>
</svg>
