<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Cute animal friends playing around the frame">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="230" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="900" height="230" rx="14" fill="#0D1117"/>
    <rect x="1" y="1" width="898" height="228" rx="13" fill="none" stroke="#30363D" stroke-width="2"/>

    <!-- stars twinkling -->
    <g fill="#58A6FF">
      <circle cx="80" cy="34" r="2"><animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="22" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="38" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="20" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="40" r="2"><animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="14" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- moon -->
    <circle cx="845" cy="42" r="16" fill="#FFD166" opacity="0.9"/>
    <circle cx="852" cy="37" r="13" fill="#0D1117"/>

    <!-- ground -->
    <rect x="0" y="192" width="900" height="38" fill="#161B22"/>
    <line x1="0" y1="192" x2="900" y2="192" stroke="#30363D" stroke-width="2"/>

    <!-- ========== ORANGE BLOB running left -> right ========== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-90 0; 990 0" dur="11s" repeatCount="indefinite"/>
      <g transform="translate(0,150)">
        <animateTransform attributeName="transform" type="translate" values="0 150;0 140;0 150" dur="0.45s" repeatCount="indefinite"/>
        <!-- legs -->
        <rect x="8" y="34" width="9" height="12" rx="4" fill="#E8590C">
          <animate attributeName="height" values="12;6;12" dur="0.45s" repeatCount="indefinite"/>
        </rect>
        <rect x="30" y="34" width="9" height="12" rx="4" fill="#E8590C">
          <animate attributeName="height" values="6;12;6" dur="0.45s" repeatCount="indefinite"/>
        </rect>
        <!-- body -->
        <rect x="0" y="-8" width="48" height="46" rx="10" fill="#F76707"/>
        <!-- eyes -->
        <rect x="10" y="4" width="8" height="8" rx="2" fill="#0D1117"/>
        <rect x="30" y="4" width="8" height="8" rx="2" fill="#0D1117"/>
        <!-- happy mouth -->
        <path d="M17 22 q7 6 14 0" stroke="#0D1117" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ========== OTTER waddling right -> left ========== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="990 0; -90 0" dur="14s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-4 24 190; 4 24 190; -4 24 190" dur="0.6s" repeatCount="indefinite"/>
        <!-- body -->
        <ellipse cx="24" cy="172" rx="22" ry="24" fill="#C77B4A"/>
        <ellipse cx="24" cy="180" rx="13" ry="14" fill="#F3D9B1"/>
        <!-- head -->
        <circle cx="24" cy="140" r="17" fill="#C77B4A"/>
        <circle cx="12" cy="128" r="5" fill="#C77B4A"/>
        <circle cx="36" cy="128" r="5" fill="#C77B4A"/>
        <ellipse cx="24" cy="146" rx="10" ry="8" fill="#F3D9B1"/>
        <circle cx="18" cy="137" r="2.4" fill="#3B2417"/>
        <circle cx="30" cy="137" r="2.4" fill="#3B2417"/>
        <ellipse cx="24" cy="144" rx="3" ry="2.2" fill="#3B2417"/>
        <!-- bow tie -->
        <path d="M17 160 l7 4 7 -4 v8 l-7 -4 -7 4 z" fill="#FFD166"/>
        <!-- little arms -->
        <ellipse cx="6" cy="168" rx="5" ry="8" fill="#B26A3C">
          <animateTransform attributeName="transform" type="rotate" values="0 6 162; 25 6 162; 0 6 162" dur="0.6s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="42" cy="168" rx="5" ry="8" fill="#B26A3C">
          <animateTransform attributeName="transform" type="rotate" values="0 42 162; -25 42 162; 0 42 162" dur="0.6s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </g>

    <!-- ========== CAT chasing a ball, left -> right, faster ========== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-140 0; 1040 0" dur="7s" repeatCount="indefinite"/>
      <!-- ball rolling ahead -->
      <g transform="translate(70,181)">
        <circle r="9" fill="#FF7B72"/>
        <path d="M-9 0 a9 9 0 0 1 18 0" fill="#FFD166">
          <animateTransform attributeName="transform" type="rotate" values="0;360" dur="0.8s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- cat -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="0.5s" repeatCount="indefinite"/>
        <!-- tail -->
        <path d="M-14 172 q-12 -8 -6 -20" stroke="#8B949E" stroke-width="6" fill="none" stroke-linecap="round">
          <animate attributeName="d" values="M-14 172 q-12 -8 -6 -20; M-14 172 q-14 -2 -12 -16; M-14 172 q-12 -8 -6 -20" dur="0.5s" repeatCount="indefinite"/>
        </path>
        <!-- body -->
        <ellipse cx="8" cy="172" rx="24" ry="16" fill="#8B949E"/>
        <!-- head -->
        <circle cx="32" cy="158" r="14" fill="#8B949E"/>
        <path d="M22 148 l-3 -9 8 4 z" fill="#8B949E"/>
        <path d="M42 148 l3 -9 -8 4 z" fill="#8B949E"/>
        <circle cx="28" cy="156" r="2.2" fill="#0D1117"/>
        <circle cx="38" cy="156" r="2.2" fill="#0D1117"/>
        <path d="M30 163 q3 3 6 0" stroke="#0D1117" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- legs -->
        <rect x="-8" y="184" width="6" height="10" rx="3" fill="#6E7681">
          <animate attributeName="height" values="10;4;10" dur="0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="16" y="184" width="6" height="10" rx="3" fill="#6E7681">
          <animate attributeName="height" values="4;10;4" dur="0.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- ========== PENGUIN in the middle: jumps and waves hello ========== -->
    <g transform="translate(450,0)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0;0 0;0 0" keyTimes="0;0.15;0.3;0.6;1" dur="3s" repeatCount="indefinite"/>
        <!-- body -->
        <ellipse cx="0" cy="168" rx="20" ry="26" fill="#24292F"/>
        <ellipse cx="0" cy="174" rx="13" ry="18" fill="#F0F6FC"/>
        <!-- eyes -->
        <circle cx="-6" cy="152" r="2.6" fill="#F0F6FC"/>
        <circle cx="6" cy="152" r="2.6" fill="#F0F6FC"/>
        <circle cx="-6" cy="152" r="1.3" fill="#0D1117"/>
        <circle cx="6" cy="152" r="1.3" fill="#0D1117"/>
        <!-- beak -->
        <path d="M-4 158 h8 l-4 6 z" fill="#FFD166"/>
        <!-- feet -->
        <ellipse cx="-8" cy="194" rx="7" ry="3.5" fill="#FFD166"/>
        <ellipse cx="8" cy="194" rx="7" ry="3.5" fill="#FFD166"/>
        <!-- waving flipper -->
        <ellipse cx="20" cy="162" rx="5" ry="12" fill="#24292F">
          <animateTransform attributeName="transform" type="rotate" values="0 18 172; -60 18 172; 0 18 172; 0 18 172" keyTimes="0;0.2;0.4;1" dur="3s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="-20" cy="166" rx="5" ry="12" fill="#24292F"/>
      </g>
      <!-- greeting bubble -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.45;0.6;1" dur="3s" repeatCount="indefinite"/>
        <rect x="14" y="112" width="44" height="24" rx="12" fill="#161B22" stroke="#30363D"/>
        <text x="36" y="128" font-family="Segoe UI, sans-serif" font-size="12" fill="#58A6FF" text-anchor="middle">hi! e</text>
      </g>
    </g>

    <!-- ========== BUNNY doing crazy flips, right side ========== -->
    <g transform="translate(700,0)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -46; 0 0; 0 0" keyTimes="0;0.25;0.5;1" dur="2.6s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 0 165; 0 0 165; 360 0 165; 360 0 165" keyTimes="0;0.1;0.5;1" dur="2.6s" repeatCount="indefinite"/>
          <!-- ears -->
          <ellipse cx="-6" cy="132" rx="4.5" ry="15" fill="#E6EDF3"/>
          <ellipse cx="6" cy="132" rx="4.5" ry="15" fill="#E6EDF3"/>
          <ellipse cx="-6" cy="134" rx="2" ry="10" fill="#FFB3C1"/>
          <ellipse cx="6" cy="134" rx="2" ry="10" fill="#FFB3C1"/>
          <!-- head -->
          <circle cx="0" cy="155" r="13" fill="#E6EDF3"/>
          <circle cx="-5" cy="153" r="2" fill="#0D1117"/>
          <circle cx="5" cy="153" r="2" fill="#0D1117"/>
          <ellipse cx="0" cy="159" rx="2.4" ry="1.8" fill="#FFB3C1"/>
          <!-- body -->
          <ellipse cx="0" cy="178" rx="14" ry="14" fill="#E6EDF3"/>
          <circle cx="13" cy="182" r="5" fill="#F0F6FC"/>
        </g>
      </g>
      <!-- landing puff -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.48;0.53;0.65;1" dur="2.6s" repeatCount="indefinite"/>
        <circle cx="-16" cy="190" r="4" fill="#8B949E"/>
        <circle cx="16" cy="190" r="4" fill="#8B949E"/>
        <circle cx="0" cy="193" r="3" fill="#8B949E"/>
      </g>
    </g>

    <!-- ========== hearts floating when critters cross the middle ========== -->
    <g fill="#FF7B72">
      <path d="M300 120 c-4 -8 -16 -4 -12 4 c2 5 12 10 12 10 c0 0 10 -5 12 -10 c4 -8 -8 -12 -12 -4 z" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -26" dur="4s" begin="1s" repeatCount="indefinite"/>
      </path>
      <path d="M580 128 c-3 -7 -14 -3 -10 3 c2 4 10 8 10 8 c0 0 8 -4 10 -8 c4 -6 -7 -10 -10 -3 z" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="5s" begin="2.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -30" dur="5s" begin="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
